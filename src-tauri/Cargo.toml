[package]
name = "s3-eye"
version = "0.1.0"
description = "Desktop browser for S3-compatible buckets"
license = "MIT"
edition = "2024"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = "1.157.0"
aws-config = "1.13.0"
aws-credential-types = "1.3.1"
keyring = "4.2.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
